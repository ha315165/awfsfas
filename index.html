<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DustWatch - UAE Dust Risk Outlook</title>
    <meta name="description" content="Experimental 12-hour dust risk outlook across the UAE combining hourly weather and air-quality forecast data." />
    <meta property="og:title" content="DustWatch - UAE Dust Risk Outlook" />
    <meta property="og:description" content="Experimental 12-hour dust risk outlook across the UAE combining hourly weather and air-quality forecast data." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/dustwatch-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/dustwatch-logo.png" />
    <link rel="icon" type="image/png" href="/assets/dustwatch-logo-transparent.png" />
    <link rel="apple-touch-icon" href="/assets/dustwatch-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
    <script>
      try {
        const theme = localStorage.getItem('dustwatch_theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F7F1E8] dark:bg-[#101820] text-[#1E2522] dark:text-[#F4F6F8] antialiased transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
